# H102 uses one IIOD for both Ethernet and the inherited PS USB FunctionFS gadget.
# Standalone iiod.service is disabled when installing this override.
[Unit]
Requires=h102-lab-disable-tx.service
After=h102-lab-disable-tx.service
Conflicts=iiod.service

[Service]
# Remove the inherited stop command: the standalone daemon is no longer started.
ExecStartPre=
